<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wald-3D-Navigator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0a0a1a; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -1px 0 rgba(0, 0, 0, 0.1);
    }
    .glass-glow { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 0 -1px 0 rgba(0, 0, 0, 0.1), 0 0 30px rgba(255, 255, 255, 0.04); }
    #info-panel { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(30px); padding: 24px 32px; max-width: 520px; width: 92%; opacity: 0; pointer-events: auto; z-index: 10; }
    #info-panel.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    #info-panel h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); letter-spacing: -0.3px; }
    #info-panel p { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.7; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    #info-panel .close-btn { position: absolute; top: 14px; right: 18px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; color: rgba(255,255,255,0.6); transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
    #info-panel .close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; transform: scale(1.1); }
    #top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
    #top-bar > div { padding: 12px 20px; pointer-events: auto; }
    #top-bar .title { font-size: 16px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
    #top-bar .counter { font-size: 13px; color: rgba(255,255,255,0.55); margin-left: 10px; font-weight: 400; }
    #top-bar .hint { font-size: 12px; color: rgba(255,255,255,0.45); }
    #weather-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 6px; padding: 6px; z-index: 10; pointer-events: auto; }
    .weather-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: rgba(255,255,255,0.5); backdrop-filter: blur(12px); }
    .weather-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); color: rgba(255,255,255,0.9); }
    .weather-btn.active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    #scroll-hint { position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, 50%); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; z-index: 10; opacity: 1; transition: opacity 1s; }
    #scroll-hint.hidden { opacity: 0; }
    #scroll-hint .mouse { width: 26px; height: 42px; border: 2px solid rgba(255,255,255,0.5); border-radius: 14px; position: relative; background: rgba(255,255,255,0.03); backdrop-filter: blur(4px); }
    #scroll-hint .mouse::after { content: ''; position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 4px; height: 7px; background: rgba(255,255,255,0.7); border-radius: 2px; animation: scrollWheel 1.8s ease-in-out infinite; }
    @keyframes scrollWheel { 0% { top: 7px; opacity: 1; } 100% { top: 22px; opacity: 0; } }
    #scroll-hint span { font-size: 12px; color: rgba(255,255,255,0.6); text-shadow: 0 1px 8px rgba(0,0,0,0.4); letter-spacing: 0.5px; }
    #progress-dots { position: absolute; top: 50%; right: 28px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; z-index: 10; padding: 12px 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto; position: relative; }
    .dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid transparent; transition: all 0.4s; }
    .dot.active { background: #fff; border-color: #fff; box-shadow: 0 0 16px rgba(255,255,255,0.4), 0 0 40px rgba(255,255,255,0.15); transform: scale(1.4); }
    #loading { position: absolute; inset: 0; background: #87CEEB; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 1.2s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 32px; color: #fff; margin-bottom: 20px; text-shadow: 0 2px 12px rgba(0,0,0,0.1); font-weight: 600; letter-spacing: -0.5px; }
    #loading .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.25) 100%); }
    @media (max-width: 640px) { #info-panel { bottom: 20px; padding: 16px 20px; } #top-bar { top: 12px; left: 12px; right: 12px; } #top-bar > div { padding: 10px 14px; } #top-bar .hint { display: none; } #weather-switch { top: 12px; right: 12px; } .weather-btn { width: 40px; height: 40px; font-size: 18px; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="vignette"></div>
    <div id="loading"><h1>🌲 Wald wird geladen...</h1><div class="spinner"></div></div>
    <div id="top-bar">
      <div class="glass glass-glow"><span class="title">🌲 Wald 3D Navigator</span><span class="counter"><span id="current-num">1</span> / <span id="total-num">4</span></span></div>
      <div class="glass glass-glow hint">🖱️ Scrollen zum Weiterfliegen</div>
    </div>
    <div id="weather-switch" class="glass glass-glow">
      <button class="weather-btn active" data-weather="day" title="Sonnenschein">☀️</button>
      <button class="weather-btn" data-weather="night" title="Nacht">🌙</button>
    </div>
    <div id="scroll-hint"><div class="mouse"></div><span>Scrollen zum Erkunden</span></div>
    <div id="info-panel" class="glass glass-glow">
      <button class="close-btn" onclick="window.dispatchEvent(new CustomEvent('closeInfo'))">&times;</button>
      <h2><span id="info-icon">🌲</span> <span id="info-title">Willkommen im Wald</span></h2>
      <p id="info-desc">Erkunde den Zauberwald. Scrolle nach unten, um zur nächsten Station zu gelangen.</p>
    </div>
    <div id="progress-dots" class="glass glass-glow"></div>
  </div>
  <script type="module">

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const CONFIG = {
      worldSize: 500,
      cameraHeight: 3.0,
      cameraDistance: 12,
      flySpeed: 1.5,
      scrollDebounce: 900,
    };

    const INFO_POINTS = [
      { 
        id: 0, 
        position: new THREE.Vector3(0, 3, 0), 
        lookAt: new THREE.Vector3(0, 3, -15), 
        title: "Willkommen im Wald", 
        desc: "Tauche ein in den stillen Zauber dieses Urwaldes. Die Bäume ragen zum Himmel, Vögel zwitschern im Blätterdach. Scrolle nach unten, um weiterzufliegen.", 
        color: 0x8BC34A, 
        glowColor: 0x8BC34A, 
        icon: "🌲" 
      },
      { 
        id: 1, 
        position: new THREE.Vector3(-40, 3, -30), 
        lookAt: new THREE.Vector3(-40, 3, -50), 
        title: "Der Alte Baum", 
        desc: "Ein mächtiger Stamm mit brüchigem Schilf am Rand. Die Rinde raubt an Farbe, als trüge er die Jahrhundere in seinen Ringen.", 
        color: 0xA1887F, 
        glowColor: 0xBCAAA4, 
        icon: "🪵" 
      },
      { 
        id: 2, 
        position: new THREE.Vector3(50, 3, -20), 
        lookAt: new THREE.Vector3(50, 3, -40), 
        title: "Lichtung im Wald", 
        desc: "Ein Lichtstrahl bricht durch das dichte Blätterdach. Hier wachsen Moos und Pilze in stiller Gemeinschaft.", 
        color: 0x9575CD, 
        glowColor: 0xCE93D8, 
        icon: "☀️" 
      },
      { 
        id: 3, 
        position: new THREE.Vector3(10, 3, -80), 
        lookAt: new THREE.Vector3(10, 3, -100), 
        title: "Waldrand", 
        desc: "Der Wald endet, doch die Stille bleibt. Vielleicht hörst du das Rascheln jenseits der Bäume – ein Eichhörnchen, oder nur der Wind.", 
        color: 0x4DB6AC, 
        glowColor: 0x80CBC4, 
        icon: "🐿️" 
      }
    ];

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, CONFIG.cameraHeight, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.minPolarAngle = 0.2;
    controls.target.copy(INFO_POINTS[0].lookAt);
    controls.update();

    // LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    sunLight.position.set(50, 100, 60);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 500;
    sunLight.shadow.camera.left = -200;
    sunLight.shadow.camera.right = 200;
    sunLight.shadow.camera.top = 200;
    sunLight.shadow.camera.bottom = -200;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x4CAF50, 0.35);
    scene.add(hemiLight);

    // BODEN
    const groundGeo = new THREE.PlaneGeometry(CONFIG.worldSize * 2, CONFIG.worldSize * 2, 50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2E7D32, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // WALD-MODELL LADEN
    const gltfLoader = new GLTFLoader();
    let forestModel = null;

    gltfLoader.load(
      './assets/models/low_poly_forest.glb',
      (gltf) => {
        forestModel = gltf.scene;
        // Wald vergrößern für Tunnel-Effekt (50x)
        forestModel.scale.set(15, 15, 15);
        forestModel.position.set(0, -1, -30);
        // Leichte Rotation für natürliche Perspektive
        forestModel.rotation.y = Math.PI / 12;
        forestModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        scene.add(forestModel);
        console.log('Waldmodell geladen:', forestModel);
      },
      undefined,
      (error) => {
        console.error('Fehler beim Laden des Waldes:', error);
      }
    );

    // NAVIGATION
    let currentPointIndex = 0;
    let isFlying = false;
    let lastScrollTime = 0;
    let scrollHintHidden = false;

    const dotsContainer = document.getElementById('progress-dots');
    INFO_POINTS.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => navigateTo(i));
      dotsContainer.appendChild(dot);
    });

    function updateDots() {
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentPointIndex);
      });
      document.getElementById('current-num').textContent = currentPointIndex + 1;
    }

    const infoPanel = document.getElementById('info-panel');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');
    const infoIcon = document.getElementById('info-icon');
    const scrollHint = document.getElementById('scroll-hint');

    function showInfo(index) {
      const pt = INFO_POINTS[index];
      infoTitle.textContent = pt.title;
      infoDesc.textContent = pt.desc;
      infoIcon.textContent = pt.icon;
      infoPanel.classList.add('visible');
    }

    function hideInfo() { infoPanel.classList.remove('visible'); }
    window.addEventListener('closeInfo', hideInfo);

    function navigateTo(index) {
      if (isFlying || index === currentPointIndex) return;
      isFlying = true;
      hideInfo();
      if (!scrollHintHidden) { scrollHintHidden = true; scrollHint.classList.add('hidden'); }

      const target = INFO_POINTS[index];
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const endPos = target.position.clone();
      endPos.y = CONFIG.cameraHeight;
      const startTime = performance.now();
      const duration = CONFIG.flySpeed * 1000;

      function animateFly(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        camera.position.lerpVectors(startPos, endPos, ease);
        camera.position.y += Math.sin(t * Math.PI) * 3;

        controls.target.lerpVectors(startTarget, target.lookAt, ease);
        controls.update();

        if (t < 1) {
          requestAnimationFrame(animateFly);
        } else {
          isFlying = false;
          currentPointIndex = index;
          controls.target.copy(target.lookAt);
          controls.update();
          updateDots();
          showInfo(index);
        }
      }
      requestAnimationFrame(animateFly);
    }

    window.addEventListener('wheel', (e) => {
      const now = performance.now();
      if (now - lastScrollTime < CONFIG.scrollDebounce) return;
      if (Math.abs(e.deltaY) > 15) {
        lastScrollTime = now;
        if (e.deltaY > 0) {
          navigateTo((currentPointIndex + 1) % INFO_POINTS.length);
        } else {
          navigateTo((currentPointIndex - 1 + INFO_POINTS.length) % INFO_POINTS.length);
        }
      }
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', (e) => {
      const now = performance.now();
      if (now - lastScrollTime < CONFIG.scrollDebounce) return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(deltaY) > 40) {
        lastScrollTime = now;
        navigateTo(deltaY > 0 ? (currentPointIndex + 1) % INFO_POINTS.length : (currentPointIndex - 1 + INFO_POINTS.length) % INFO_POINTS.length);
      }
    }, { passive: true });

    // WETTER SYSTEM
    let currentWeather = 'day';

    function setWeather(weather) {
      currentWeather = weather;
      const p = weatherPresets[weather];
      scene.background.setHex(p.bg);
      scene.fog.color.setHex(p.fog);
      scene.fog.density = p.fogDensity;
      ambientLight.intensity = p.ambient;
      sunLight.intensity = p.sun;
      hemiLight.intensity = p.hemi;
      renderer.toneMappingExposure = p.exposure;
      groundMat.color.setHex(p.groundColor);
      document.querySelectorAll('.weather-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.weather === weather);
      });
    }

    const weatherPresets = {
      day: { bg: 0x87CEEB, fog: 0x87CEEB, fogDensity: 0.008, ambient: 0.5, sun: 1.2, hemi: 0.35, exposure: 1.0, groundColor: 0x2E7D32 },
      night: { bg: 0x0D1117, fog: 0x0D1117, fogDensity: 0.02, ambient: 0.1, sun: 0.1, hemi: 0.05, exposure: 0.6, groundColor: 0x1a2e1a },
    };

    document.querySelectorAll('.weather-btn').forEach(btn => {
      btn.addEventListener('click', () => setWeather(btn.dataset.weather));
    });

    // ANIMATION LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    camera.lookAt(INFO_POINTS[0].lookAt);
    controls.target.copy(INFO_POINTS[0].lookAt);
    controls.update();
    showInfo(0);
    document.getElementById('total-num').textContent = INFO_POINTS.length;

    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 2000);

    animate();
  </script>
</body>
</html>
